openapi: 3.1.0
info:
  title: ML Service contract (backend → ML)
  version: 1.0.0
  description: |
    Что бэкенд вызывает у ML-сервиса. Реализации: настоящий ML-сервис команды ML и `ml-stub` (детерминированный).

    **Аутентификация:** `Authorization: Bearer <ML_SERVICE_TOKEN>` (общий секрет бэкенд ↔ ML).

    **Инструменты агента:** в каждом запросе бэкенд передаёт `tools` — базовый URL Tools API и **run-токен**,
    ограниченный компанией и `run_id` этого запуска (TTL = deadline + 60 с). ML ходит в Tools API и LLM Gateway
    только с этим токеном. Прямые вызовы LLM-провайдера запрещены.

    **Идемпотентность:** `request_id` (повтор с тем же `request_id` в течение 24 ч возвращает тот же результат/job).

    **Таймауты и ретраи (сторона бэкенда):** generate sync — 60 с, chat — 90 с до первого байта 15 с, score — 10 с.
    Ретраи: 2 повтора с экспоненциальной задержкой (1 с, 4 с) на 502/503/504 и сетевые ошибки; на 4xx не ретраим.
    При недоступности ML бэкенд деградирует на `ml-stub`/кэш (SPEC NFR-9).

    **Самопроверка:** если агент решил, что событие нерелевантно компании или данных недостаточно, он возвращает
    `status: skipped` с причиной — это валидный исход, а не ошибка.
servers:
  - url: http://ml-stub:8100
    description: ml-stub в docker-compose
security:
  - bearerAuth: []
paths:
  /health:
    get:
      summary: Liveness
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: ok }
                  version: { type: string }
  /v1/insights/generate:
    post:
      summary: Сгенерировать инсайт для пары компания × событие × роль
      operationId: generateInsight
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GenerateRequest" }
            examples:
              sync:
                externalValue: ./examples/generate.request.json
      responses:
        "200":
          description: Готовый результат (sync)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenerateResult" }
        "202":
          description: Принято в работу (async); опрашивать GET /v1/jobs/{job_id}
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobAccepted" }
        "401": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/jobs/{job_id}:
    get:
      summary: Статус асинхронной генерации
      operationId: getJob
      parameters:
        - { name: job_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Статус
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/JobAccepted"
                  - $ref: "#/components/schemas/GenerateResult"
        "404": { $ref: "#/components/responses/Problem" }
  /v1/chat:
    post:
      summary: Ответ на вопрос пользователя к аналитике (стриминг SSE)
      operationId: chat
      description: |
        Ответ стримится как `text/event-stream`. События:
        - `step` — `{"type": "...", "name": "..."}` (опционально, для UI «агент ищет в аналитике…»);
        - `token` — `{"delta": "..."}`;
        - `source` — объект `Source` из insight.schema.json (`$defs/source`);
        - `done` — `ChatFinal`;
        - `error` — `Problem`.
        Пример потока: `examples/chat.sse.txt`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatRequest" }
            examples:
              ask:
                externalValue: ./examples/chat.request.json
      responses:
        "200":
          description: SSE-поток
          content:
            text/event-stream:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /v1/score:
    post:
      summary: Батч-скоринг кандидатов (опционально; иначе baseline бэкенда)
      operationId: score
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScoreRequest" }
            examples:
              batch:
                externalValue: ./examples/score.request.json
      responses:
        "200":
          description: Скоры
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScoreResponse" }
        "422": { $ref: "#/components/responses/Problem" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  responses:
    Problem:
      description: Ошибка (RFC 7807)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    Role:
      type: string
      enum: [owner, ceo, cfo, chief_accountant, treasurer, other]
    ToolsAccess:
      type: object
      required: [base_url, token, run_id]
      properties:
        base_url: { type: string, format: uri, example: "http://api:8000/internal/tools" }
        llm_base_url: { type: string, format: uri, example: "http://api:8000/internal/llm" }
        token: { type: string, description: "Run-scoped bearer token (компания + run_id)." }
        run_id: { type: string }
        allowed_tools:
          type: array
          items: { type: string }
          example: [get_company_context, get_group, get_counterparties, search_news, get_event, search_bank_analytics, get_bank_products, get_market_data, log_step]
    CandidateHint:
      type: object
      description: Что baseline бэкенда уже знает о паре (подсказка агенту, не обязательна к использованию).
      properties:
        score: { type: number, minimum: 0, maximum: 1 }
        breakdown:
          type: object
          additionalProperties: { type: number }
        matched_features:
          type: array
          items: { type: string }
        urgent: { type: boolean }
    GenerateRequest:
      type: object
      required: [request_id, company_id, event_id, role, tools, schema_version]
      properties:
        request_id: { type: string, description: "Ключ идемпотентности." }
        company_id: { type: string, pattern: "^U_[0-9]+$" }
        event_id: { type: string, format: uuid }
        role: { $ref: "#/components/schemas/Role" }
        mode: { type: string, enum: [sync, async], default: sync }
        deadline_ms: { type: integer, default: 60000 }
        schema_version: { type: string, description: "Версия insight.schema.json, которую ожидает бэкенд.", example: "1.0.0" }
        candidate: { $ref: "#/components/schemas/CandidateHint" }
        tools: { $ref: "#/components/schemas/ToolsAccess" }
        options:
          type: object
          properties:
            allow_llm: { type: boolean, default: true, description: "false — бюджет исчерпан, только детерминированные методы." }
            preferred_model: { type: [string, "null"] }
    GenerateResult:
      type: object
      required: [request_id, status]
      properties:
        request_id: { type: string }
        status: { type: string, enum: [completed, skipped, failed] }
        insight:
          description: "Инсайт по contracts/insight.schema.json (при status=completed)."
          $ref: "./insight.schema.json"
        skip_reason:
          type: [string, "null"]
          enum: [not_relevant, insufficient_data, duplicate, budget_exhausted, unsafe_content, null]
        error: { $ref: "#/components/schemas/Problem" }
        usage:
          type: object
          properties:
            llm_calls: { type: integer }
            tokens_in: { type: integer }
            tokens_out: { type: integer }
            latency_ms: { type: integer }
    JobAccepted:
      type: object
      required: [job_id, status]
      properties:
        job_id: { type: string }
        status: { type: string, enum: [accepted, running] }
        request_id: { type: string }
    ChatMessage:
      type: object
      required: [role, content]
      properties:
        role: { type: string, enum: [user, assistant] }
        content: { type: string, maxLength: 4000 }
    ChatRequest:
      type: object
      required: [request_id, company_id, role, messages, tools]
      properties:
        request_id: { type: string }
        company_id: { type: string, pattern: "^U_[0-9]+$" }
        role: { $ref: "#/components/schemas/Role" }
        insight_id: { type: [string, "null"], format: uuid, description: "Если вопрос к конкретному инсайту." }
        insight:
          description: "Полный инсайт (если insight_id задан) — чтобы не делать лишний вызов."
          anyOf:
            - $ref: "./insight.schema.json"
            - type: "null"
        intent:
          type: string
          enum: [clarify, other_slice, source, free]
          default: free
          description: "clarify — уточняющий вопрос; other_slice — данные в другом разрезе; source — к первоисточнику."
        messages:
          type: array
          minItems: 1
          maxItems: 20
          items: { $ref: "#/components/schemas/ChatMessage" }
        tools: { $ref: "#/components/schemas/ToolsAccess" }
    ChatFinal:
      type: object
      required: [answer, sources, statements]
      properties:
        answer: { type: string }
        sources:
          type: array
          items: { $ref: "./insight.schema.json#/$defs/source" }
        statements:
          type: array
          items: { $ref: "./insight.schema.json#/$defs/statement" }
        disclaimers:
          type: array
          items: { $ref: "./insight.schema.json#/$defs/disclaimer" }
    ScoreItem:
      type: object
      required: [company_id, event_id]
      properties:
        company_id: { type: string }
        event_id: { type: string, format: uuid }
        role: { $ref: "#/components/schemas/Role" }
        baseline: { $ref: "#/components/schemas/CandidateHint" }
    ScoreRequest:
      type: object
      required: [request_id, items]
      properties:
        request_id: { type: string }
        items:
          type: array
          maxItems: 500
          items: { $ref: "#/components/schemas/ScoreItem" }
        tools: { $ref: "#/components/schemas/ToolsAccess" }
    ScoreResponse:
      type: object
      required: [request_id, scores]
      properties:
        request_id: { type: string }
        scorer: { type: string, example: "ml-ranker@0.3" }
        scores:
          type: array
          items:
            type: object
            required: [company_id, event_id, score]
            properties:
              company_id: { type: string }
              event_id: { type: string, format: uuid }
              score: { type: number, minimum: 0, maximum: 1 }
              breakdown:
                type: object
                additionalProperties: { type: number }
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, example: "https://alfa-future.local/problems/validation" }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        trace_id: { type: string }
