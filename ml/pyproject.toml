[project]
name = "alfa-ml"
version = "0.1.0"
description = "ML service: insight agent, chat, reranker for the Alfa-Business news analytics case"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.28",
    "pydantic>=2.9",
    "jsonschema[format-nongpl]>=4.23",
    "structlog>=24.4",
    "fastembed>=0.9,<0.10",  # ONNX embeddings + cross-encoder reranker on CPU (ADR-ML-011)
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]
analysis = [
    "pandas>=2.2",
    "pyarrow>=18",
]

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["alfa_ml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "E501"]  # long lines are Russian text literals; code is wrapped by ruff format

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["alfa_ml"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["jsonschema.*", "fastembed.*"]
ignore_missing_imports = true
