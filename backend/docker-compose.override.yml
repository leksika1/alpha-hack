# Local host ports for the backend stack. Not used in Dokploy (it deploys backend/docker-compose.yml alone).
# Picked up by the root docker-compose.yml (include) and by a plain `docker compose up` in backend/.
# Infrastructure listens on 127.0.0.1 and uncommon ports: a local Postgres/Redis/MinIO must not block the start.

services:
  postgres:
    ports: ["127.0.0.1:${POSTGRES_PORT:-15432}:5432"]
  redis:
    ports: ["127.0.0.1:${REDIS_PORT:-16379}:6379"]
  minio:
    ports: ["127.0.0.1:${MINIO_PORT:-19000}:9000", "127.0.0.1:${MINIO_CONSOLE_PORT:-19001}:9001"]
  api:
    ports: ["${API_PORT:-8000}:8000"]
  ml-stub:
    ports: ["${ML_STUB_PORT:-8100}:8100"]
