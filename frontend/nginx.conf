server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SSE (вопросы к аналитике, уведомления): без буферизации и с длинным таймаутом.
  # Адрес бэкенда — переменная BACKEND_UPSTREAM (образ nginx подставляет её при старте). Имя резолвится при запросе,
  # а не при старте: фронтенд поднимается, даже если бэкенд ещё не готов (в Dokploy это отдельный сервис).
  location /api/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream ${BACKEND_UPSTREAM};
    proxy_pass $backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
  }

  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  # SPA: все остальные пути отдаём index.html
  location / {
    try_files $uri /index.html;
  }
}
